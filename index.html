<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Thi Thử Trắc Nghiệm - Phát triển bởi: Chan Canh Chua (C3)</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .question { margin-bottom: 10px; font-weight: bold; }
        .options label { display: block; margin: 5px 0; }
        button { padding: 10px 20px; cursor: pointer; margin-top: 15px; }
        select { padding: 10px; margin-right: 10px; font-size: 16px; max-width: 400px;}
        #setup-container { margin-bottom: 20px; }
    </style>
</head>
<body>
    <h2>Hệ Thống Thi Thử Trắc Nghiệm</h2>
    <div id="setup-container">
        <label for="examSelect"><strong>Chọn bộ đề thi: </strong></label>
        <select id="examSelect">
            <option value="">Đang tải danh sách đề...</option>
        </select>
        <button onclick="startQuiz()">Bắt đầu thi</button>
    </div>
    <div id="loading" style="display: none;">Đang xử lý...</div>
    <div id="quiz-container" style="display: none;">
        <div id="questions"></div>
        <button onclick="submitQuiz()">Nộp Bài</button>
    </div>
    <h3 id="result"></h3>
    <script>
        const supabaseUrl = 'https://kezzrlltzddpdtktfqzk.supabase.co';
        const supabaseKey = 'sb_publishable_-OA922t0e8G3z3hM0hwguQ_GIAaGmec';
        const client = window.supabase.createClient(supabaseUrl, supabaseKey);
        let quizData = [];

        async function loadExamTypes() {
            const { data, error } = await client.from('de_thi').select('loai_de');
            if (error) {
                console.error("Lỗi:", error);
                document.getElementById('examSelect').innerHTML = 
                    '<option value="">Lỗi tải dữ liệu</option>';
                return;
            }
            const uniqueTypes = [...new Set(data.map(item => item.loai_de).filter(Boolean))];
            const select = document.getElementById('examSelect');
            select.innerHTML = '';
            uniqueTypes.forEach(type => {
                select.innerHTML += `<option value="${type}">${type}</option>`;
            });
        }

        async function startQuiz() {
            const selectedExam = document.getElementById('examSelect').value;
            if (!selectedExam) return alert("Vui lòng đợi hoặc chọn đề thi!");
            
            document.getElementById('setup-container').style.display = 'none';
            document.getElementById('loading').style.display = 'block';
            document.getElementById('result').innerText = '';
            
            const { data, error } = await client.from('de_thi')
                .select('*').eq('loai_de', selectedExam);
            
            if (error || !data || data.length === 0) {
                document.getElementById('loading').innerText = 'Lỗi hoặc đề trống!';
                return;
            }
            processData(data);
        }

        function shuffle(array) {
            return array.sort(() => Math.random() - 0.5);
        }

        function processData(data) {
            quizData = shuffle(data).slice(0, 100).map(row => {
                let options = shuffle([row.A, row.B, row.C, row.D].filter(Boolean));
                return { q: row.CauHoi, options, answer: row[row.DapAn] || row.DapAn };
            });
            document.getElementById('loading').style.display = 'none';
            document.getElementById('quiz-container').style.display = 'block';
            renderQuiz();
        }

        function renderQuiz() {
            const container = document.getElementById('questions');
            container.innerHTML = quizData.map((item, i) => `
                <div class="question">Câu ${i + 1}: ${item.q}</div>
                <div class="options">
                    ${item.options.map(opt => 
                        `<label><input type="radio" name="q${i}" value="${opt}"> ${opt}</label>`
                    ).join('')}
                </div><br>
            `).join('');
        }

        function submitQuiz() {
            let score = 0;
            quizData.forEach((item, index) => {
                const sel = document.querySelector(`input[name="q${index}"]:checked`);
                if (sel && sel.value === String(item.answer)) score++;
            });
            document.getElementById('result').innerText = `Điểm: ${score}/${quizData.length}`;
            document.getElementById('setup-container').style.display = 'block';
            document.getElementById('quiz-container').style.display = 'none';
            window.scrollTo(0, 0);
        }

        loadExamTypes();
    </script>
</body>
</html>
